/**:
  ros__parameters:
    # calibration window: this many seconds of usable frames (robot standing, flat ground in view)
    calibration_duration_s: 30.0
    frame_period_s: 0.5
    # give up and use fallback_a/b if no calibration is accepted by then
    max_calibration_time_s: 300.0
    min_camera_height_m: 0.4
    # pass raw depth through until calibrated (false: hold it back)
    publish_before_calibrated: true
    # set both to skip calibration and use a known correction (1/z = a/z_zed + b)
    fixed_a: .nan
    fixed_b: .nan
    fallback_a: 1.0
    fallback_b: 0.0
    # ground pixels used for the fit
    min_z: 1.0
    max_z: 8.0
    pixel_step: 4
    tf_timeout_s: 0.1
    # reliable subscriptions (large images are often dropped best-effort); set false for
    # best-effort-only publishers
    reliable_input: true
    # calibrate once at start-up from "ground" (ground_frame) or "lidar" (lidar_topic; falls back to
    # the ground if no scan arrives within lidar_wait_s)
    calibration_source: ground
    # lidar (PointCloud2), for lidar calibration and the depth quality report; empty: no lidar
    lidar_topic: ""
    # fixed frame for compensating motion between scan and image (empty: no compensation)
    lidar_odom_frame: ""
    # rotation applied to the points in their TF frame, if the TF doesn't match the mounting
    # (Spot hamilton: Mid-360 upside down, TF identity -> [180.0, 0.0, 0.0])
    lidar_mount_rpy_deg: [0.0, 0.0, 0.0]
    lidar_timeout_s: 2.0
    lidar_wait_s: 30.0
    # lidar calibration is complete once the window spans lidar_calibration_duration_s and has
    # lidar_min_bin_pairs pairs at 0.5-3, 3-5 and 5-9.5 m; after lidar_max_calibration_duration_s
    # it fits with what it has and reports WARNING (far range not covered)
    lidar_calibration_duration_s: 10.0
    lidar_max_calibration_duration_s: 60.0
    lidar_min_bin_pairs: [500, 300, 300]
    lidar_min_z: 0.5
    # stay below the ZED max depth (depth_max, 10 m by default)
    lidar_max_z: 9.5
    # corrected depth vs lidar (last 30 s) as its own ros_system_monitor row, while scans arrive
    quality_enabled: true
    quality_period_s: 2.0
    quality_nickname: zed_depth_quality
